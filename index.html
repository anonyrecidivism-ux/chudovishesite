<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recidivismoss | toolkit</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

:root {
  --bg-top: #ffb6c1;
  --bg-bottom: #ff85a2;
  --card-bg: rgba(255, 255, 255, 0.2);
  --card-border: rgba(255, 255, 255, 0.4);
  --text: #ffffff;
  --text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
  --accent: #fff;
  --status-on: #a8ffb2;
  --status-off: #ffb3b3;
}

* { box-sizing: border-box; text-transform: lowercase; }

body {
  margin: 0;
  background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 600px;
  margin: auto;
  padding: 24px 16px;
  padding-bottom: 80px;
}

/* header & square logo on the right */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  gap: 12px;
}

.title-block {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.title {
  font-size: 20px;
  color: var(--accent);
  font-weight: 900;
  text-shadow: var(--text-shadow);
  letter-spacing: 1px;
  word-break: break-word;
}

.author {
  font-size: 11px;
  opacity: 0.8;
  font-weight: bold;
}

.author span {
  cursor: pointer;
  border-bottom: 1px dashed rgba(255,255,255,0.5);
  margin-left: 5px;
}

.logo-img {
  width: 75px; 
  height: 75px;
  border-radius: 14px; 
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
  border: 2px solid rgba(255, 255, 255, 0.6);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}

/* inputs & buttons */
input {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  outline: none;
  font-family: 'Nunito', monospace;
  font-size: 15px;
  font-weight: bold;
  text-shadow: var(--text-shadow);
  text-align: center;
}

input::placeholder { color: rgba(255, 255, 255, 0.6); }

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.tab {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  min-width: 50px;
}

.tab.active {
  background: rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 16px;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  font-weight: 900;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 16px;
  transition: 0.3s;
  border: 1px solid var(--card-border);
  text-shadow: var(--text-shadow);
}

button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.45); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* cards & visuals */
.card {
  margin-top: 16px;
  padding: 16px;
  border-radius: 20px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  animation: fadeUp 0.4s ease;
  font-size: 13px;
  text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
  word-wrap: break-word;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  margin-bottom: 12px;
  font-size: 13px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  padding-bottom: 6px;
}

.add-btn { cursor: pointer; opacity: 0.7; font-size: 16px; transition: 0.2s; }
.add-btn:hover { opacity: 1; color: #a8ffb2; }

/* Widgets (Indicia style) */
.widget-flex { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
.widget-avatar { width: 70px; height: 70px; border-radius: 15px; border: 2px solid #fff; background: rgba(255,255,255,0.1); object-fit: cover; }
.widget-info b { font-size: 16px; }
.widget-status { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 5px;}
.online { background: var(--status-on); color: #000; }
.offline { background: var(--status-off); color: #000; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.grid a {
  display: block;
  padding: 12px 10px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  font-size: 12px;
  font-weight: bold;
  background: rgba(0,0,0,0.1);
  transition: 0.2s;
}

.grid a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

/* Special styling for App Links */
.app-link { background: rgba(255,255,255,0.2) !important; border: 1px solid #fff !important; }
.app-link:hover { background: #fff !important; color: #ff85a2 !important; }

.map-container {
  width: 100%; height: 180px; border-radius: 12px; overflow: hidden; margin-top: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.1);
}

.footer { margin-top: 40px; font-size: 11px; color: rgba(255, 255, 255, 0.7); text-align: center; }

/* Notepad Modal */
.notepad-modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  z-index: 1000; display: flex; justify-content: center; align-items: center;
  opacity: 0; pointer-events: none; transition: 0.3s;
}
.notepad-modal.active { opacity: 1; pointer-events: all; }
.notepad-content {
  width: 90%; max-width: 500px; background: rgba(255, 182, 193, 0.95);
  padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.notepad-content textarea {
  width: 100%; height: 250px; background: rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.4);
  border-radius: 12px; padding: 12px; color: #fff; font-family: monospace; font-size: 13px; resize: none; outline: none; margin: 10px 0;
}
.np-btn-group { display: flex; gap: 10px; }
.np-btn-group button { margin-top: 0; padding: 12px; font-size: 13px; flex: 1; }
</style>
</head>

<body>

<canvas id="p"></canvas>

<div class="wrap">

<div class="header">
  <div class="title-block">
    <div class="title">recidivismoss | toolkit</div>
    <div class="author">by @recidivismnational <span onclick="toggleNotepad()">📝 notepad</span></div>
  </div>
  <img src="43313.png" onerror="this.onerror=null; this.src='https://i.postimg.cc/xCzkznN1/file-00000000170471f4b4f82e3d4fc7aa20.png'" alt="logo" class="logo-img">
</div>

<input id="q" placeholder="ip / domain / email / phone / nick" autocomplete="off" spellcheck="false">

<div class="tabs">
  <div class="tab active" data-type="auto">auto</div>
  <div class="tab" data-type="ip">ip</div>
  <div class="tab" data-type="domain">domain</div>
  <div class="tab" data-type="phone">phone</div>
  <div class="tab" data-type="email">email</div>
  <div class="tab" data-type="socials">socials</div>
</div>

<button id="scan-btn" onclick="run()">initiate scan</button>

<div id="out"></div>

<div class="footer">recidivismoss toolkit · build v1.1 (ultimate)</div>

</div>

<div class="notepad-modal" id="np-modal">
  <div class="notepad-content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">notepad</h3>
      <span style="cursor:pointer; font-size:24px;" onclick="toggleNotepad()">×</span>
    </div>
    <textarea id="np-text" placeholder="saved data here..."></textarea>
    <div class="np-btn-group">
      <button onclick="exportTxt()">.txt</button>
      <button onclick="exportPdf()">.pdf</button>
    </div>
  </div>
</div>

<script>
// === UTILS (СИНТАКСИЧЕСКИ БЕЗОПАСНЫЙ ESCAPE) ===
function escapeHTML(str) { 
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;"); 
}

// === NOTEPAD ===
const npText = document.getElementById("np-text");
const npModal = document.getElementById("np-modal");
npText.value = localStorage.getItem("rmoss_notepad") || "";
npText.oninput = () => localStorage.setItem("rmoss_notepad", npText.value);
function toggleNotepad() { npModal.classList.toggle("active"); }
npModal.onclick = (e) => { if(e.target===npModal) toggleNotepad(); };

function saveToNotepad(e, title, text) {
  let newData = `\n[${title.toUpperCase()}]\n${text.trim()}\n`;
  npText.value += newData;
  localStorage.setItem("rmoss_notepad", npText.value);
  const btn = e.target; btn.innerText = "✓";
  setTimeout(() => { btn.innerText = "[+]"; }, 1000);
}

function exportTxt() {
  const blob = new Blob([npText.value], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "recidivismoss_dump.txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportPdf() {
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="font-family:monospace;white-space:pre-wrap;padding:20px;"><h2>recidivismoss export</h2><hr>${escapeHTML(npText.value)}</body></html>`);
  win.document.close(); win.focus();
  setTimeout(() => win.print(), 500);
}

// === SEARCH CORE ===
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

let forcedType = "auto";
document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    forcedType = tab.dataset.type;
  };
});

function detect(q) {
  if (forcedType !== "auto") return forcedType;
  const c = q.replace(/\s/g, "");
  if (/^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(c)) return "ip";
  if (c.includes("@")) return "email";
  if (/^\+?[0-9\-\(\)]{7,15}$/.test(c)) return "phone";
  if (c.includes(".") && !c.includes(" ")) return "domain";
  return "socials";
}

function analyzePhone(digits) {
  let info = { region: "unknown", carrier: "unknown" };
  if (digits.startsWith('380')) {
    info.region = "ukraine 🇺🇦"; let code = digits.substring(3, 5);
    if (['67','68','96','97','98'].includes(code)) info.carrier = "kyivstar";
    else if (['50','66','95','99'].includes(code)) info.carrier = "vodafone";
    else if (['63','73','93'].includes(code)) info.carrier = "lifecell";
  } else if (digits.startsWith('79')) {
    info.region = "russia 🇷🇺"; let code = digits.substring(1, 4);
    if (['91','98'].some(c => code.startsWith(c))) info.carrier = "mts";
    else if (['92','93'].some(c => code.startsWith(c))) info.carrier = "megafon";
    else if (['99'].some(c => code.startsWith(c))) info.carrier = "tele2";
  }
  return info;
}

async function run() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const btn = document.getElementById("scan-btn");
  btn.disabled = true; btn.innerText = "scanning...";
  const out = document.getElementById("out");
  out.innerHTML = "";
  
  const type = detect(q);
  addCard("target analysis", `query: ${q}\ntype: ${type}`);

  try {
    // === 1. IP SCAN ===
    if (type === "ip") {
      let lat, lon;
      try {
        const d = await fetch(`https://ipwho.is/${encodeURIComponent(q)}`).then(r => r.json());
        if (!d.success) throw new Error();
        
        const sec = d.security || {};
        let threatStatus = "";
        if (sec.vpn) threatStatus += "🚨 VPN DETECTED\n";
        if (sec.proxy) threatStatus += "🚨 PROXY DETECTED\n";
        if (sec.tor) threatStatus += "🚨 TOR NODE DETECTED\n";
        if (!sec.vpn && !sec.proxy && !sec.tor) threatStatus += "✅ CLEAN IP (NO VPN/PROXY)\n";

        addCard("ip threat intel", threatStatus.trim());
        addCard("geolocation", `asn: ${d.connection?.asn || 'N/A'}\ncountry: ${d.country} ${d.flag?.emoji || ''}\ncity: ${d.city}`);
        lat = d.latitude; lon = d.longitude;
      } catch (e) {
        const fallback = await fetch(`https://ipapi.co/${encodeURIComponent(q)}/json/`).then(r => r.json());
        addCard("geolocation (fallback)", `org: ${fallback.org}\ncountry: ${fallback.country_name}\ncity: ${fallback.city}`);
        lat = fallback.latitude; lon = fallback.longitude;
      }

      // НАДЕЖНЫЕ GOOGLE MAPS
      if (lat && lon) {
        addCardHtml("map view", `<div class="map-container"><iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=${lat},${lon}&hl=en&z=12&output=embed"></iframe></div>`);
      }

      addCardHtml("threat intel databases", `<div class="grid">
        <a href="https://www.virustotal.com/gui/ip-address/${encodeURIComponent(q)}" target="_blank">virustotal</a>
        <a href="https://otx.alienvault.com/indicator/ip/${encodeURIComponent(q)}" target="_blank">alienvault</a>
        <a href="https://www.abuseipdb.com/check/${encodeURIComponent(q)}" target="_blank">abuseipdb</a>
        <a href="https://shodan.io/host/${encodeURIComponent(q)}" target="_blank">shodan</a>
      </div>`);
    }

    // === 2. DOMAIN SCAN ===
    else if (type === "domain") {
      const clean = q.replace(/https?:\/\//, "").split("/")[0];
      try {
        const dns = await fetch(`https://networkcalc.com/api/dns/lookup/${encodeURIComponent(clean)}`).then(r => r.json());
        if (dns.records) addCard("dns records", JSON.stringify(dns.records, null, 2));
        else addCard("dns records", "no public records found.");
        
        if (dns.records && dns.records.A && dns.records.A.length > 0) {
          const hostIp = dns.records.A[0].address;
          const ipData = await fetch(`https://ipapi.co/${encodeURIComponent(hostIp)}/json/`).then(r => r.json());
          if (ipData.latitude && ipData.longitude) {
            addCard("server geolocation", `resolved ip: ${hostIp}\norg: ${ipData.org}\ncountry: ${ipData.country_name}\ncity: ${ipData.city}`);
            addCardHtml("server map", `<div class="map-container"><iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=${ipData.latitude},${ipData.longitude}&hl=en&z=12&output=embed"></iframe></div>`);
          }
        }
      } catch (e) { addCard("dns error", "failed to fetch records."); }

      addCardHtml("threat intel & whois", `<div class="grid">
        <a href="https://www.virustotal.com/gui/domain/${encodeURIComponent(clean)}" target="_blank">virustotal</a>
        <a href="https://crt.sh/?q=${encodeURIComponent(clean)}" target="_blank">ssl certs</a>
        <a href="https://whois.domaintools.com/${encodeURIComponent(clean)}" target="_blank">whois</a>
        <a href="https://dnsdumpster.com/" target="_blank">dnsdumpster</a>
      </div>`);
    }

    // === 3. PHONE SCAN ===
    else if (type === "phone") {
      const digits = q.replace(/\D/g, "");
      const info = analyzePhone(digits);
      
      addCard("local intelligence", `region: ${info.region}\ncarrier: ${info.carrier}\nformatted: +${digits}`);
      addCardHtml("app deep links", `
        <div style="font-size:11px; margin-bottom:10px; opacity:0.8;">Click below to securely open profiles inside installed apps (Deep Links):</div>
        <div class="grid">
          <a href="tg://resolve?phone=${digits}" class="app-link">📱 open in telegram</a>
          <a href="whatsapp://send?phone=${digits}" class="app-link">🟢 open whatsapp</a>
          <a href="viber://contact?number=%2B${digits}" class="app-link">🟣 open viber</a>
          <a href="https://web.getcontact.com/" target="_blank">🔍 getcontact web</a>
        </div>
      `);
    }

    // === 4. EMAIL SCAN ===
    else if (type === "email") {
      const em = q.toLowerCase();
      const domain = em.split('@')[1];
      
      const identiconHtml = `
        <div class="widget-flex">
          <img src="https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(em)}&backgroundColor=b6e3f4" class="widget-avatar" style="background:#fff;">
          <div class="widget-info">
            <b>${escapeHTML(em)}</b><br>
            <span style="opacity:0.7">domain: ${escapeHTML(domain)}</span>
          </div>
        </div>
      `;
      addCardHtmlCustom("email identity", identiconHtml, `email: ${em}`);

      try {
        const check = await fetch(`https://disposable.debounce.io/?email=${encodeURIComponent(em)}`).then(r=>r.json());
        const isDisposable = check.disposable === "true";
        addCard("security check", `disposable/temp mail: ${isDisposable ? "⚠️ YES" : "✅ NO"}\nstatus: active analysis complete.`);
      } catch(e) {}

      try {
        const dns = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`).then(r=>r.json());
        if(dns.Answer) {
          addCard("mail server check (mx)", `✅ servers are responding.\nrecords found: ${dns.Answer.length}`);
        } else {
          addCard("mail server check (mx)", `❌ no mx records found. domain cannot receive mail.`);
        }
      } catch(e) {}

      addCardHtml("breach databases (leaks)", `<div class="grid">
        <a href="https://intelx.io/?s=${encodeURIComponent(em)}" target="_blank">intelx search</a>
        <a href="https://leakcheck.io/search?type=email&query=${encodeURIComponent(em)}" target="_blank">leakcheck base</a>
        <a href="https://haveibeenpwned.com/account/${encodeURIComponent(em)}" target="_blank">have i been pwned</a>
      </div>`);
    }

    // === 5. SOCIALS & USERNAME SCAN ===
    else if (type === "socials") {
      const uname = encodeURIComponent(q.replace(/\s/g, ""));
      const cleanName = q.replace(/\s/g, "");
      
      // ROBLOX WIDGET
      try {
        const rSearch = await fetch(`https://users.roproxy.com/v1/users/search?keyword=${uname}&limit=1`).then(r => r.json());
        if (rSearch.data && rSearch.data.length > 0) {
          const uid = rSearch.data[0].id;
          const [p, fw, fr, av, st] = await Promise.all([
            fetch(`https://users.roproxy.com/v1/users/${uid}`).then(r => r.json()),
            fetch(`https://friends.roproxy.com/v1/users/${uid}/followers/count`).then(r => r.json()),
            fetch(`https://friends.roproxy.com/v1/users/${uid}/friends/count`).then(r => r.json()),
            fetch(`https://thumbnails.roproxy.com/v1/users/avatar?userIds=${uid}&size=150x150&format=Png&isCircular=false`).then(r => r.json()),
            fetch(`https://presence.roproxy.com/v1/presence/users`, {method:'POST', body: JSON.stringify({userIds:[uid]})}).then(r => r.json())
          ]);

          const isOnline = st.userPresences?.[0]?.userPresenceType > 0;
          const html = `
            <div class="widget-flex">
              <img src="${av.data[0]?.imageUrl || ''}" class="widget-avatar">
              <div class="widget-info">
                <b>${escapeHTML(p.displayName)}</b> <span class="widget-status ${isOnline?'online':'offline'}">${isOnline?'online':'offline'}</span><br>
                <span style="opacity:0.7">@${escapeHTML(p.name)}</span><br>
                <span style="font-size:11px; opacity:0.5;">id: ${uid}</span>
              </div>
            </div>
            <div style="margin:10px 0; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px;"><i>${escapeHTML(p.description || "no bio provided")}</i></div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:11px; opacity:0.9;">
              <span>👥 friends: ${fr.count}</span>
              <span>📈 followers: ${fw.count}</span>
              <span>📅 join: ${new Date(p.created).getFullYear()}</span>
            </div>
          `;
          addCardHtmlCustom("roblox widget (indicia style)", html, `user: ${p.name} | id: ${uid} | bio: ${p.description}`);
        }
      } catch(e) {}

      // GITHUB WIDGET
      try {
        const gh = await fetch(`https://api.github.com/users/${uname}`).then(r => r.json());
        if (gh.id) {
          const ghHtml = `
            <div class="widget-flex">
              <img src="${gh.avatar_url}" class="widget-avatar">
              <div class="widget-info">
                <b>${escapeHTML(gh.name || cleanName)}</b><br>
                <span style="opacity:0.7">@${escapeHTML(gh.login)}</span>
              </div>
            </div>
            <div style="margin:10px 0; font-size:12px;"><i>${escapeHTML(gh.bio || "no bio")}</i></div>
            <div style="display:flex; justify-content:space-between; font-size:11px; opacity:0.9;">
              <span>📦 repos: ${gh.public_repos}</span>
              <span>📈 followers: ${gh.followers}</span>
            </div>
          `;
          addCardHtmlCustom("github widget", ghHtml, `github: ${gh.login}\nrepos: ${gh.public_repos}`);
        }
      } catch(e) {}

      // SMART DEEP LINKS (No CORS issues, opens right in apps)
      addCardHtml("smart app links (social check)", `
        <div style="font-size:11px; margin-bottom:10px; opacity:0.8;">Click to force-open profile inside the app. If profile exists, app will load it immediately:</div>
        <div class="grid">
          <a href="tg://resolve?domain=${uname}" class="app-link">📱 open telegram</a>
          <a href="instagram://user?username=${uname}" class="app-link">📸 open instagram</a>
          <a href="fb://profile/${uname}" class="app-link">📘 open facebook</a>
          <a href="https://www.tiktok.com/@${uname}" class="app-link">🎵 open tiktok</a>
        </div>
      `);

      // DISCORD OSINT
      addCardHtml("discord intelligence", `<div class="grid">
        <a href="https://discordlookup.com/user/${uname}" target="_blank">discordlookup.com</a>
        <a href="https://discord.id/" target="_blank">discord.id check</a>
        <a href="https://lookup.guru/" target="_blank">lookup.guru stats</a>
      </div>`);
    }

  } catch (e) { addCard("error", e.message); }
  finally { btn.disabled = false; btn.innerText = "initiate scan"; }
}

// === DOM & EVENT RENDERERS ===
function addCard(title, text) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title"><span>${escapeHTML(title)}</span><span class="add-btn">[+]</span></div><div><pre style="margin:0; font-family:inherit; white-space:pre-wrap;">${escapeHTML(text)}</pre></div>`;
  d.querySelector(".add-btn").onclick = (e) => saveToNotepad(e, title, text);
  document.getElementById("out").appendChild(d);
}
function addCardHtml(title, html) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title">${escapeHTML(title)}</div>${html}`;
  document.getElementById("out").appendChild(d);
}
function addCardHtmlCustom(title, html, raw) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title"><span>${escapeHTML(title)}</span><span class="add-btn">[+]</span></div>${html}`;
  d.querySelector(".add-btn").onclick = (e) => saveToNotepad(e, title, raw);
  document.getElementById("out").appendChild(d);
}

// === CANVAS ===
const c = document.getElementById("p"); const ctx = c.getContext("2d");
let w, h, pts = [];
function resize() { w=c.width=innerWidth; h=c.height=innerHeight; pts=[]; for(let i=0;i<60;i++) pts.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*2+1}); }
window.onresize = resize; resize();
function loop() { ctx.clearRect(0,0,w,h); ctx.fillStyle="rgba(255,255,255,0.4)"; pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}); requestAnimationFrame(loop); }
loop();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recidivismoss | toolkit</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

:root {
  --bg-top: #ffb6c1;
  --bg-bottom: #ff85a2;
  --card-bg: rgba(255, 255, 255, 0.2);
  --card-border: rgba(255, 255, 255, 0.4);
  --text: #ffffff;
  --text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.3);
  --accent: #fff;
  --status-on: #a8ffb2;
  --status-off: #ffb3b3;
}

* { box-sizing: border-box; text-transform: lowercase; }

body {
  margin: 0;
  background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 600px;
  margin: auto;
  padding: 24px 16px;
  padding-bottom: 80px;
}

/* header & logo */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  gap: 12px;
}

.title-block {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.title {
  font-size: 20px;
  color: var(--accent);
  font-weight: 900;
  text-shadow: var(--text-shadow);
  letter-spacing: 1px;
}

.author {
  font-size: 11px;
  opacity: 0.8;
  font-weight: bold;
}

.author span {
  cursor: pointer;
  border-bottom: 1px dashed rgba(255,255,255,0.5);
  margin-left: 5px;
}

.logo-img {
  width: 75px; 
  height: 75px;
  border-radius: 14px; 
  object-fit: cover;
  box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
  border: 2px solid rgba(255, 255, 255, 0.6);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  outline: none;
  font-family: 'Nunito', monospace;
  font-size: 15px;
  font-weight: bold;
  text-shadow: var(--text-shadow);
  text-align: center;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.tab {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--card-border);
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
  min-width: 50px;
}

.tab.active {
  background: rgba(255, 255, 255, 0.4);
  transform: translateY(-2px);
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 16px;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  font-weight: 900;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
  border: 1px solid var(--card-border);
}

button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.45); }
button:disabled { opacity: 0.5; cursor: wait; }

/* cards */
.card {
  margin-top: 16px;
  padding: 18px;
  border-radius: 20px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  animation: fadeUp 0.4s ease;
  font-size: 13px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  margin-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  padding-bottom: 6px;
}

.add-btn { cursor: pointer; opacity: 0.7; font-size: 14px; transition: 0.2s; }
.add-btn:hover { opacity: 1; color: #a8ffb2; }

/* Widgets */
.w-flex { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
.w-avatar { width: 70px; height: 70px; border-radius: 15px; border: 2px solid #fff; background: rgba(255,255,255,0.1); object-fit: cover; }
.w-status { font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 5px; }
.online { background: var(--status-on); color: #000; }
.offline { background: var(--status-off); color: #000; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.grid a {
  display: block;
  padding: 10px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  font-size: 11px;
  font-weight: bold;
  background: rgba(0,0,0,0.1);
  transition: 0.2s;
  word-break: break-word;
}
.grid a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }

/* Deep Links styling */
.app-link { background: rgba(255,255,255,0.2) !important; border: 1px solid #fff !important; }
.app-link:hover { background: #fff !important; color: #ff85a2 !important; }

.map-box {
  width: 100%; height: 180px; border-radius: 12px; overflow: hidden; margin-top: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.1);
}

.footer { margin-top: 40px; font-size: 11px; color: rgba(255, 255, 255, 0.7); text-align: center; }

/* Modal */
.modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 1000;
  display: none; justify-content: center; align-items: center;
}
.modal.active { display: flex; }
.modal-c {
  width: 90%; max-width: 500px; background: rgba(255, 182, 193, 0.95);
  padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.modal-c textarea {
  width: 100%; height: 250px; background: rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.4);
  border-radius: 12px; padding: 12px; color: #fff; font-family: monospace; resize: none; outline: none; margin: 10px 0;
}
</style>
</head>

<body>
<canvas id="p"></canvas>

<div class="wrap">
  <div class="header">
    <div class="title-block">
      <div class="title">recidivismoss | toolkit</div>
      <div class="author">by @recidivismnational <span onclick="toggleNp()">[notepad]</span></div>
    </div>
    <img src="43313.png" onerror="this.onerror=null; this.src='https://i.postimg.cc/xCzkznN1/file-00000000170471f4b4f82e3d4fc7aa20.png'" alt="logo" class="logo-img">
  </div>

  <input id="q" placeholder="ip / domain / email / phone / nick" autocomplete="off" spellcheck="false">

  <div class="tabs">
    <div class="tab active" data-type="auto">auto</div>
    <div class="tab" data-type="ip">ip</div>
    <div class="tab" data-type="domain">domain</div>
    <div class="tab" data-type="phone">phone</div>
    <div class="tab" data-type="email">email</div>
    <div class="tab" data-type="socials">socials</div>
  </div>

  <button id="scan-btn" onclick="run()">initiate scan</button>
  <div id="out"></div>
  <div class="footer">recidivismoss toolkit · build v1.3.1 (strict mode)</div>
</div>

<div class="modal" id="np-m">
  <div class="modal-c">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">notepad</h3>
      <span style="cursor:pointer; font-size:24px;" onclick="toggleNp()">x</span>
    </div>
    <textarea id="np-t" placeholder="data here..."></textarea>
    <div style="display:flex; gap:10px;">
      <button onclick="expTxt()" style="margin:0; padding:12px; font-size:13px; flex:1;">export .txt</button>
      <button onclick="expPdf()" style="margin:0; padding:12px; font-size:13px; flex:1;">export .pdf</button>
    </div>
  </div>
</div>

<script>
// === ИДЕАЛЬНЫЙ ESCAPE (БЕЗ ОШИБОК) ===
function esc(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "'");
}

// === NOTEPAD ===
const npt = document.getElementById("np-t");
const npm = document.getElementById("np-m");
npt.value = localStorage.getItem("rmoss_np") || "";
npt.oninput = () => localStorage.setItem("rmoss_np", npt.value);
function toggleNp() { npm.classList.toggle("active"); }
npm.onclick = (e) => { if(e.target===npm) toggleNp(); };

function save(e, title, text) {
  npt.value += `\n[${title.toUpperCase()}]\n${text.trim()}\n`;
  localStorage.setItem("rmoss_np", npt.value);
  const b = e.target; b.innerText = "[saved]";
  setTimeout(() => b.innerText = "[+]", 1000);
}

function expTxt() {
  const blob = new Blob([npt.value], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "recidivismoss_dump.txt"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function expPdf() {
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="font-family:monospace;white-space:pre-wrap;padding:20px;"><h2>recidivismoss export</h2><hr>${esc(npt.value)}</body></html>`);
  win.document.close(); win.focus();
  setTimeout(() => win.print(), 500);
}

document.getElementById("q").onkeydown = (e) => { if(e.key==="Enter") run(); };

let fType = "auto";
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    fType = t.dataset.type;
  };
});

function detect(q) {
  if (fType !== "auto") return fType;
  const c = q.replace(/\s/g, "");
  if (/^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(c)) return "ip";
  if (c.includes("@")) return "email";
  if (/^\+?[0-9\-\(\)]{7,15}$/.test(c)) return "phone";
  if (c.includes(".") && !c.includes(" ")) return "domain";
  return "socials";
}

function analyzePhone(digits) {
  let info = { region: "unknown", carrier: "unknown" };
  if (digits.startsWith('380')) {
    info.region = "ukraine"; let code = digits.substring(3, 5);
    if (['67','68','96','97','98'].includes(code)) info.carrier = "kyivstar";
    else if (['50','66','95','99'].includes(code)) info.carrier = "vodafone";
    else if (['63','73','93'].includes(code)) info.carrier = "lifecell";
  } else if (digits.startsWith('79')) {
    info.region = "russia"; let code = digits.substring(1, 4);
    if (['91','98'].some(c => code.startsWith(c))) info.carrier = "mts";
    else if (['92','93'].some(c => code.startsWith(c))) info.carrier = "megafon";
    else if (['99'].some(c => code.startsWith(c))) info.carrier = "tele2";
  }
  return info;
}

async function run() {
  const q = document.getElementById("q").value.trim();
  if(!q) return;
  const b = document.getElementById("scan-btn");
  b.disabled = true; b.innerText = "scanning...";
  const out = document.getElementById("out");
  out.innerHTML = "";
  const type = detect(q);

  addC("target analysis", `query: ${q}\ntype: ${type}`);

  try {
    // === 1. IP SCAN ===
    if (type === "ip") {
      let lat, lon;
      try {
        const d = await fetch(`https://ipwho.is/${encodeURIComponent(q)}`).then(r=>r.json());
        if(d.success) {
          const sec = d.security || {};
          const threat = (sec.vpn || sec.proxy || sec.tor) ? "[WARN] vpn/proxy detected" : "[OK] clean residential";
          addC("ip intelligence", `status: ${threat}\nasn: ${d.connection?.asn}\ncountry: ${d.country}\ncity: ${d.city}`);
          lat = d.latitude; lon = d.longitude;
        }
      } catch(e) {
        const fb = await fetch(`https://ipapi.co/${encodeURIComponent(q)}/json/`).then(r=>r.json());
        addC("geolocation (fallback)", `org: ${fb.org}\ncountry: ${fb.country_name}\ncity: ${fb.city}`);
        lat = fb.latitude; lon = fb.longitude;
      }
      
      if(lat && lon) {
        addH("map view", `<div class="map-box"><iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=$${lat},${lon}&hl=en&z=12&output=embed"></iframe></div>`);
      }

      addH("advanced threat databases", `<div class="grid">
        <a href="https://www.virustotal.com/gui/ip-address/${encodeURIComponent(q)}" target="_blank">virustotal</a>
        <a href="https://shodan.io/host/${encodeURIComponent(q)}" target="_blank">shodan</a>
        <a href="https://search.censys.io/hosts/${encodeURIComponent(q)}" target="_blank">censys.io</a>
        <a href="https://www.abuseipdb.com/check/${encodeURIComponent(q)}" target="_blank">abuseipdb</a>
        <a href="https://otx.alienvault.com/indicator/ip/${encodeURIComponent(q)}" target="_blank">alienvault</a>
        <a href="https://viz.greynoise.io/ip/${encodeURIComponent(q)}" target="_blank">greynoise</a>
        <a href="https://www.ipqualityscore.com/free-ip-lookup-proxy-vpn-test/lookup/${encodeURIComponent(q)}" target="_blank">ipqualityscore</a>
      </div>`);
    }

    // === 2. DOMAIN SCAN ===
    if(type === "domain") {
       const cl = q.replace(/https?:\/\//, "").split("/")[0];
       try {
         const dns = await fetch(`https://networkcalc.com/api/dns/lookup/${encodeURIComponent(cl)}`).then(r=>r.json());
         if(dns.records) addC("dns records", JSON.stringify(dns.records, null, 2));
         
         if (dns.records && dns.records.A && dns.records.A.length > 0) {
          const hostIp = dns.records.A[0].address;
          const ipData = await fetch(`https://ipapi.co/${encodeURIComponent(hostIp)}/json/`).then(r => r.json());
          if (ipData.latitude && ipData.longitude) {
            addC("server geolocation", `resolved ip: ${hostIp}\norg: ${ipData.org}\ncountry: ${ipData.country_name}\ncity: ${ipData.city}`);
            addH("server map", `<div class="map-box"><iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=$${ipData.latitude},${ipData.longitude}&hl=en&z=12&output=embed"></iframe></div>`);
          }
         }
       } catch(e) {}
       
       addH("domain osint tools", `<div class="grid">
        <a href="https://whois.domaintools.com/${cl}" target="_blank">whois</a>
        <a href="https://dnsdumpster.com/" target="_blank">dnsdumpster</a>
        <a href="https://urlscan.io/search/#domain:${cl}" target="_blank">urlscan.io</a>
        <a href="https://securitytrails.com/domain/${cl}/dns" target="_blank">securitytrails</a>
        <a href="https://crt.sh/?q=${cl}" target="_blank">ssl certs</a>
       </div>`);
    }

    // === 3. PHONE SCAN ===
    if (type === "phone") {
      const digits = q.replace(/\D/g, "");
      const info = analyzePhone(digits);
      addC("local intelligence", `region: ${info.region}\ncarrier: ${info.carrier}\nformatted: +${digits}`);
      
      addH("direct messengers", `<div class="grid">
        <a href="tg://resolve?phone=${digits}" class="app-link">telegram</a>
        <a href="whatsapp://send?phone=${digits}" class="app-link">whatsapp</a>
        <a href="viber://contact?number=%2B${digits}" class="app-link">viber</a>
        <a href="skype:${digits}?call" class="app-link">skype</a>
      </div>`);

      addH("caller id & reputation", `<div class="grid">
        <a href="https://web.getcontact.com/" target="_blank">getcontact</a>
        <a href="https://sync.me/search/?number=${digits}" target="_blank">sync.me</a>
        <a href="https://numbuster.com/ru/phone/${digits}" target="_blank">numbuster</a>
        <a href="https://www.truecaller.com/search/global/${digits}" target="_blank">truecaller</a>
        <a href="https://tellows.com/num/${digits}" target="_blank">tellows</a>
        <a href="https://www.callapp.com/phone/${digits}" target="_blank">callapp</a>
      </div>`);

      addH("advanced leaks & dorks", `<div class="grid">
        <a href="https://intelx.io/?s=${digits}" target="_blank">intelx leaks</a>
        <a href="https://www.google.com/search?q=%22${digits}%22" target="_blank">google dork</a>
        <a href="https://yandex.com/search/?text=%22${digits}%22" target="_blank">yandex search</a>
      </div>`);
    }

    // === 4. EMAIL SCAN ===
    if (type === "email") {
      const em = q.toLowerCase();
      const domain = em.split('@')[1];

      addH("identity", `<div class="w-flex"><img src="https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(em)}&backgroundColor=b6e3f4" class="w-avatar" style="background:#fff;"><div class="w-info"><b>${esc(em)}</b><br><span style="opacity:0.7">domain: ${esc(domain)}</span></div></div>`);
      
      try {
        const check = await fetch(`https://disposable.debounce.io/?email=${encodeURIComponent(em)}`).then(r=>r.json());
        const isDisp = check.disposable === "true";
        addC("security check", `disposable/temp mail: ${isDisp ? "[WARN] YES" : "[OK] NO"}`);
      } catch(e) {}

      try {
        const dns = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`).then(r=>r.json());
        addC("mx records", dns.Answer ? `[OK] active servers: ${dns.Answer.length}` : `[FAIL] dead domain`);
      } catch(e) {}

      addH("osint & reputation", `<div class="grid">
        <a href="https://epieos.com/?q=${encodeURIComponent(em)}" target="_blank">epieos</a>
        <a href="https://emailrep.io/${encodeURIComponent(em)}" target="_blank">emailrep.io</a>
        <a href="https://hunter.io/email-verifier/${encodeURIComponent(em)}" target="_blank">hunter.io</a>
        <a href="https://www.skymem.info/srch?q=${encodeURIComponent(domain)}" target="_blank">skymem domain</a>
        <a href="https://rocketreach.co/search?keyword=${encodeURIComponent(em)}" target="_blank">rocketreach</a>
      </div>`);

      addH("breach databases", `<div class="grid">
        <a href="https://haveibeenpwned.com/account/${encodeURIComponent(em)}" target="_blank">hibp</a>
        <a href="https://intelx.io/?s=${encodeURIComponent(em)}" target="_blank">intelx leaks</a>
        <a href="https://leakcheck.io/search?type=email&query=${encodeURIComponent(em)}" target="_blank">leakcheck</a>
        <a href="https://snusbase.com/" target="_blank">snusbase</a>
        <a href="https://leak-lookup.com/search" target="_blank">leak-lookup</a>
        <a href="https://dehashed.com/search?query=${encodeURIComponent(em)}" target="_blank">dehashed</a>
        <a href="https://breachdirectory.org/search?query=${encodeURIComponent(em)}" target="_blank">breachdirectory</a>
      </div>`);

      addH("advanced dorks", `<div class="grid">
        <a href="https://www.google.com/search?q=%22${encodeURIComponent(em)}%22" target="_blank">google exact</a>
        <a href="https://www.google.com/search?q=site:pastebin.com+%22${encodeURIComponent(em)}%22" target="_blank">pastebin logs</a>
      </div>`);
    }

    // === 5. SOCIALS SCAN ===
    if (type === "socials") {
      const u = encodeURIComponent(q.replace(/\s/g, ""));
      const clName = q.replace(/\s/g, "");

      try {
        const rS = await fetch(`https://users.roproxy.com/v1/users/search?keyword=${u}&limit=1`).then(r=>r.json());
        if(rS.data && rS.data.length > 0) {
          const uid = rS.data[0].id;
          const [p, fw, fr, av, st] = await Promise.all([
            fetch(`https://users.roproxy.com/v1/users/${uid}`).then(r=>r.json()),
            fetch(`https://friends.roproxy.com/v1/users/${uid}/followers/count`).then(r=>r.json()),
            fetch(`https://friends.roproxy.com/v1/users/${uid}/friends/count`).then(r=>r.json()),
            fetch(`https://thumbnails.roproxy.com/v1/users/avatar?userIds=${uid}&size=150x150&format=Png&isCircular=false`).then(r=>r.json()),
            fetch(`https://presence.roproxy.com/v1/presence/users`, {method:'POST', body:JSON.stringify({userIds:[uid]})}).then(r=>r.json())
          ]);
          const isOn = st.userPresences?.[0]?.userPresenceType > 0;
          const h = `<div class="w-flex"><img src="${av.data[0]?.imageUrl || ''}" class="w-avatar"><div class="w-info"><b>${esc(p.displayName)}</b> <span class="w-status ${isOn?'online':'offline'}">${isOn?'online':'offline'}</span><br><span style="opacity:0.7">@${esc(p.name)}</span><br><span style="font-size:11px;opacity:0.5;">id: ${uid}</span></div></div><div style="margin:10px 0; padding:10px; background:rgba(0,0,0,0.1); border-radius:10px;"><i>${esc(p.description || "no bio")}</i></div><div style="display:flex; justify-content:space-between; font-size:11px; font-weight:bold; opacity:0.9;"><span>friends: ${fr.count||0}</span><span>followers: ${fw.count||0}</span><span>joined: ${new Date(p.created).getFullYear()}</span></div>`;
          addHC("roblox profile widget", h, `user: ${p.name} | id: ${uid}`);
        }
      } catch(e) {}

      try {
        const gh = await fetch(`https://api.github.com/users/${u}`).then(r=>r.json());
        if (gh.id) {
          const ghHtml = `<div class="w-flex"><img src="${gh.avatar_url}" class="w-avatar"><div class="w-info"><b>${esc(gh.name || clName)}</b><br><span style="opacity:0.7">@${esc(gh.login)}</span></div></div><div style="margin:10px 0; font-size:12px;"><i>${esc(gh.bio || "no bio")}</i></div><div style="display:flex; justify-content:space-between; font-size:11px; opacity:0.9;"><span>repos: ${gh.public_repos}</span><span>followers: ${gh.followers}</span></div>`;
          addHC("github widget", ghHtml, `github: ${gh.login}`);
        }
      } catch(e) {}

      addH("app deep links", `<div class="grid">
        <a href="tg://resolve?domain=${u}" class="app-link">telegram</a>
        <a href="instagram://user?username=${u}" class="app-link">instagram</a>
        <a href="fb://profile/${u}" class="app-link">facebook</a>
        <a href="https://www.tiktok.com/@${u}" class="app-link">tiktok</a>
      </div>`);

      addH("global osint databases", `<div class="grid">
        <a href="https://discordlookup.com/user/${u}" target="_blank">discordlookup</a>
        <a href="https://whatsmyname.app/?q=${u}" target="_blank">whatsmyname</a>
        <a href="https://namechk.com/?q=${u}" target="_blank">namechk</a>
        <a href="https://checkusernames.com/?username=${u}" target="_blank">checkusernames</a>
        <a href="https://vk.com/${u}" target="_blank">vk search</a>
        <a href="https://steamcommunity.com/id/${u}" target="_blank">steam</a>
      </div>`);
    }

  } catch(e) { addC("system error", e.message); }
  finally { b.disabled = false; b.innerText = "initiate scan"; }
}

// === RENDERERS ===
function addC(t, txt) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title"><span>${esc(t)}</span><span class="add-btn" title="Save to Notepad">[+]</span></div><pre style="margin:0; white-space:pre-wrap; font-family:inherit;">${esc(txt)}</pre>`;
  d.querySelector(".add-btn").onclick = (e) => save(e, t, txt);
  document.getElementById("out").appendChild(d);
}
function addH(t, h) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title">${esc(t)}</div>${h}`;
  document.getElementById("out").appendChild(d);
}
function addHC(t, h, raw) {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="card-title"><span>${esc(t)}</span><span class="add-btn" title="Save to Notepad">[+]</span></div>${h}`;
  d.querySelector(".add-btn").onclick = (e) => save(e, t, raw);
  document.getElementById("out").appendChild(d);
}

// === BACKGROUND CANVAS ===
const cv = document.getElementById("p"); const cx = cv.getContext("2d");
let w, h, pts = [];
function rs() { w=cv.width=innerWidth; h=cv.height=innerHeight; pts=[]; for(let i=0;i<60;i++) pts.push({x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4, r:Math.random()*2+1}); }
window.onresize = rs; rs();
function lp() { cx.clearRect(0,0,w,h); cx.fillStyle="rgba(255,255,255,0.4)"; pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();}); requestAnimationFrame(lp); }
lp();
</script>
